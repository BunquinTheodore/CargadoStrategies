<section class="scene" id="logo" data-field="ink" data-archetype="stage" data-iris="stop" data-globe-mode="ring" data-out-hold
               data-title="The Logo" aria-labelledby="logo-title" style="--kx: 50%; --ky: 48%">
        <div class="scene__inner">
          <div class="logo__grid">
            <h2 id="logo-title" class="eyebrow logo__eyebrow" data-group="head">The Story</h2>
            <p class="logo__line logo__line--w" data-reveal="fade" data-delay="0"><span class="logo__lead">W Stands for</span> <em class="logo__word">Wealth.</em></p>
            <div class="logo__mono" aria-hidden="true">
              <div class="logo__core" data-globe-anchor data-fit-ignore></div>
              <svg class="logo__part logo__c" viewBox="0 0 48 48" focusable="false"><path d="M37.4 10.6A19 19 0 1 0 37.4 37.4" pathLength="100" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square"/></svg>
              <svg class="logo__part logo__w" viewBox="0 0 48 48" focusable="false"><path d="M13.5 17 19.2 31.5 24 21.5 28.8 31.5 34.5 17" pathLength="100" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="miter" stroke-linecap="square"/></svg>
            </div>
            <p class="logo__line logo__line--c" data-reveal="fade" data-delay="0.1"><span class="logo__lead">C Stands for</span> <em class="logo__word">Cargado.</em></p>
            <div class="logo__notes" data-group="body" data-reveal="fade" data-delay="0.3">
              <p class="logo__how">“Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.”</p>
              <p class="logo__ref">Mark 11:24</p>
              <p class="logo__faith" data-when="REVIEW_NOTES"><span class="ph">[Optional, in the founder's words: one sentence on faith.]</span></p>
            </div>
          </div>
        </div>
      </section>
