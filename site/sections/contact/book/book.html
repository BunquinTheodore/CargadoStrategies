<section class="scene" id="book" data-entrance="slide" data-field="ink" data-archetype="P" data-stars="dim" data-title="Book a Free Consultation"
               aria-labelledby="book-title" style="--kx: 20%; --ky: 36%">
        <div class="scene__inner">
          <figure class="book__poster" data-group="media" data-book-poster hidden></figure>
          <div class="book__main">
            <div class="book__head" data-group="head">
              <h1 id="book-title" class="t-d1 book__title" data-reveal="words" data-delay="0">Book a Free <em>Consultation</em><span class="visually-hidden">.</span><span class="stop" aria-hidden="true"></span></h1>
              <p class="book__lead" data-reveal="fade" data-delay="0.06">Ten minutes on Google Meet, at no cost.</p>
            </div>
            <div class="paper book__paper" id="book-panel" data-group="body" data-reveal="fade" data-delay="0.1">
              <svg class="paper__frame" aria-hidden="true" focusable="false"><rect data-frame x=".5" y=".5"/></svg>
              <form class="stepper book-form" id="book-form" novalidate aria-labelledby="book-title">
                <div class="stepper__status">
                  <span class="stepper__count" aria-hidden="true">Step 1 of 3 · Day</span>
                  <span class="stepper__bar"><span class="stepper__fill"></span></span>
                  <p class="stepper__errors" role="alert" hidden></p>
                </div>
                <div class="stepper__steps">
                  <fieldset class="stepper__step" data-step="date" data-page="1" data-step-name="Day" data-page-name="Day">
                    <legend><h2 class="stepper__title" tabindex="-1">Choose a Day<span class="visually-hidden" data-step-of></span></h2></legend>
                    <div class="book-cal" data-calendar>
                      <div class="book-cal__head">
                        <button class="book-cal__arrow" type="button" data-days-prev aria-label="Earlier month"><span aria-hidden="true">←</span></button>
                        <p class="book-cal__title" id="book-days-range" data-days-range aria-live="polite"><span class="book-cal__month" data-days-month></span><span class="visually-hidden">, </span><span class="book-cal__zone">Central Time</span></p>
                        <button class="book-cal__arrow" type="button" data-days-next aria-label="Later month"><span aria-hidden="true">→</span></button>
                      </div>
                      <div class="book-cal__grid" data-days role="grid" aria-labelledby="book-days-range"></div>
                    </div>
                  </fieldset>
                  <fieldset class="stepper__step" data-step="time" data-page="2" data-step-name="Time" data-page-name="Time" hidden>
                    <legend><h2 class="stepper__title" tabindex="-1">Choose a Time<span class="visually-hidden" data-step-of></span></h2></legend>
                    <div class="form-row">
                      <label class="label" for="book-start">Time, in Central Time (Winnipeg)</label>
                      <select class="select" id="book-start" name="start" aria-required="true" aria-describedby="book-start-day book-start-error"></select>
                      <p class="hint" id="book-start-day" data-book-day></p>
                      <p class="error" id="book-start-error"></p>
                    </div>
                  </fieldset>
                  <fieldset class="stepper__step" data-step="you" data-page="3" data-step-name="Your Details" data-page-name="Your Details" hidden>
                    <legend><h2 class="stepper__title" tabindex="-1">Your Details<span class="visually-hidden" data-step-of></span></h2></legend>
                    <div class="book-grid">
                      <div class="form-row">
                        <label class="label" for="book-name">Your name</label>
                        <input class="input" id="book-name" name="name" autocomplete="name" maxlength="120" aria-required="true" aria-describedby="book-name-error">
                        <p class="error" id="book-name-error"></p>
                      </div>
                      <div class="form-row">
                        <label class="label" for="book-email">Email</label>
                        <input class="input" id="book-email" name="email" type="email" autocomplete="email" maxlength="254" aria-required="true" aria-describedby="book-email-error">
                        <p class="error" id="book-email-error"></p>
                      </div>
                      <div class="form-row">
                        <label class="label" for="book-phone">Phone (optional)</label>
                        <input class="input" id="book-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" aria-describedby="book-phone-error">
                        <p class="error" id="book-phone-error"></p>
                      </div>
                      <div class="form-row">
                        <label class="label" for="book-service">Service (optional)</label>
                        <select class="select" id="book-service" name="service"></select>
                      </div>
                    </div>
                  </fieldset>
                  <fieldset class="stepper__step" data-step="more" data-page="3" data-step-name="Note and Consent" data-page-name="Your Details" hidden>
                    <legend><h2 class="stepper__title" tabindex="-1">Note and Consent<span class="visually-hidden" data-step-of></span></h2></legend>
                    <div class="form-row">
                      <label class="label" for="book-note">Note (optional)</label>
                      <textarea class="textarea" id="book-note" name="note" rows="2" maxlength="1000"></textarea>
                    </div>
                    <div class="form-row">
                      <label class="check"><input type="checkbox" id="book-consent" name="consent" aria-required="true" aria-describedby="book-consent-error">
                        <!-- draft: pending lawyer review --><span data-draft="pending-lawyer-review">I agree that Cargado Strategies may use these details to book this call. See the <a href="legal.html#privacy">privacy policy</a>.</span></label>
                      <p class="error" id="book-consent-error"></p>
                    </div>
                  </fieldset>
                </div>
                <div class="hp" aria-hidden="true"><label for="book-website">Leave this field empty</label><input id="book-website" name="website" tabindex="-1" autocomplete="off"></div>
                <div class="stepper__nav">
                  <button type="button" class="btn btn--ghost" data-step-back hidden>Back</button>
                  <button type="submit" class="btn btn--primary" data-step-next>Next <span class="btn__arrow" aria-hidden="true">→</span></button>
                  <button type="submit" class="btn btn--primary" data-step-send hidden>Book the Call <span class="btn__arrow" aria-hidden="true">→</span></button>
                </div>
                <p class="book__status hint" data-book-status role="status"></p>
              </form>
              <div class="book-success" id="book-success" tabindex="-1" hidden></div>
            </div>
          </div>
        </div>
      </section>
